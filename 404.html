<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Cloudflare Pages serves this file for any path that does not match a real
     file, so it only ever runs for genuinely unknown URLs (old Wix links).
     The instant meta refresh sends those visitors to the homepage.

     This is deliberately NOT done with a `/*  /  301` rule in _redirects:
     on Cloudflare Pages that rule also matches `/` and every asset path,
     redirecting the whole site to itself in an infinite loop. It took the
     site down once. Do not reintroduce it. -->
<meta http-equiv="refresh" content="0; url=/">
<link rel="canonical" href="https://dromtrasnachallenge.com/">
<meta name="robots" content="noindex, follow">
<title>Dromtrasna Challenge</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<p>Taking you to the Dromtrasna Challenge home page&hellip;</p>
<p><a href="/">Continue to dromtrasnachallenge.com</a></p>
</body>
</html>
